<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>布谷音乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #e94560;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span {
            color: #fff;
            font-weight: 300;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 24px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .search-bar input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .search-bar input:focus {
            background: rgba(255,255,255,0.2);
        }
        .search-bar button {
            padding: 10px 20px;
            border: none;
            border-radius: 24px;
            background: #e94560;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .search-bar button:active {
            transform: scale(0.95);
        }
        .tabs {
            display: flex;
            gap: 4px;
            padding: 12px 16px 8px;
            overflow-x: auto;
            background: #1a1a2e;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .tabs button {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .tabs button.active {
            background: #e94560;
            color: #fff;
        }
        .tabs button:active {
            transform: scale(0.95);
        }
        .song-list {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .song-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .song-item:active {
            transform: scale(0.98);
            background: rgba(255,255,255,0.1);
        }
        .song-item .cover {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: #2a2a4a;
            flex-shrink: 0;
        }
        .song-item .info {
            flex: 1;
            min-width: 0;
        }
        .song-item .info .name {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-item .info .singer {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-item .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e94560;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .song-item .play-btn:active {
            transform: scale(0.9);
        }
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.4);
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.3);
        }
        .empty .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #16213e;
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: none;
            align-items: center;
            gap: 14px;
            z-index: 200;
        }
        .player-bar.show {
            display: flex;
        }
        .player-bar .cover {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .player-bar .info {
            flex: 1;
            min-width: 0;
        }
        .player-bar .info .name {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-bar .info .singer {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        .player-bar .controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .player-bar .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            transition: all 0.3s;
        }
        .player-bar .controls button:active {
            transform: scale(0.9);
        }
        .player-bar .controls .play-pause {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        audio {
            display: none;
        }
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .quick-tags {
            display: flex;
            gap: 6px;
            padding: 4px 16px 12px;
            flex-wrap: wrap;
        }
        .quick-tags button {
            padding: 4px 12px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quick-tags button:active {
            background: rgba(233,69,96,0.3);
            border-color: #e94560;
            color: #fff;
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 18px; }
            .search-bar input { font-size: 14px; padding: 8px 12px; }
            .search-bar button { padding: 8px 14px; font-size: 14px; }
            .song-item { padding: 10px 12px; }
            .song-item .cover { width: 42px; height: 42px; }
            .song-item .info .name { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎵 布谷<span>音乐</span></h1>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索歌手或歌曲..." value="周杰伦">
            <button id="searchBtn">搜索</button>
        </div>
    </div>

    <div class="tabs" id="tabContainer">
        <button class="active" data-tab="random">🎵 精选</button>
        <button data-tab="hot">🔥 热门</button>
        <button data-tab="new">✨ 最新</button>
        <button data-tab="search">🔍 歌手筛选</button>
    </div>

    <div class="quick-tags" id="quickTags"></div>

    <div class="song-list" id="songList">
        <div class="loading">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <div class="player-bar" id="playerBar">
        <img class="cover" id="playerCover" src="" alt="">
        <div class="info">
            <div class="name" id="playerName">未播放</div>
            <div class="singer" id="playerSinger">布谷音乐</div>
        </div>
        <div class="controls">
            <button id="prevBtn" title="上一首">⏮</button>
            <button class="play-pause" id="playPauseBtn">▶</button>
            <button id="nextBtn" title="下一首">⏭</button>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>
    <div class="toast" id="toast"></div>

    <script>
        // ========== 配置 ==========
        const API_SEARCH = 'http://buguyy.top/api/search';
        const API_URL = 'http://buguyy.top/api/geturl';
        const API_HOTLIST = 'http://buguyy.top/api/hotlist';
        const API_NEWLIST = 'http://buguyy.top/api/newlist';
        const API_RANDOM = 'http://buguyy.top/api/random';
        const PIC = 'https://copyright.bdstatic.com/vcg/creative/fcbafd433c4960b5039ef96217838ecf.jpg@h_1280';

        const QUICK_TAGS = ['周杰伦', '陈奕迅', '林俊杰', '邓紫棋', '薛之谦', '张学友', '刘德华', '王菲', '孙燕姿', '李荣浩', '毛不易', '张杰', '许嵩', '汪苏泷', '周深', '五月天', 'Beyond', '蔡依林', '梁静茹', '张惠妹', '赵雷', '朴树', '华晨宇', '伍佰', '许巍'];

        // ========== 状态 ==========
        let currentTab = 'random';
        let currentSongs = [];
        let currentIndex = -1;
        let isPlaying = false;
        let isLoading = false;

        // ========== DOM 引用 ==========
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const tabContainer = document.getElementById('tabContainer');
        const quickTags = document.getElementById('quickTags');
        const songList = document.getElementById('songList');
        const playerBar = document.getElementById('playerBar');
        const audioPlayer = document.getElementById('audioPlayer');
        const playerCover = document.getElementById('playerCover');
        const playerName = document.getElementById('playerName');
        const playerSinger = document.getElementById('playerSinger');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const toast = document.getElementById('toast');

        // ========== 工具函数 ==========
        function enc(v) { return encodeURIComponent(String(v == null ? '' : v)); }
        function text(v) { return String(v == null ? '' : v).trim(); }

        async function requestJson(url) {
            const res = await fetch(url, {
                headers: {
                    'User-Agent': 'Mozilla/5.0',
                    'Referer': 'https://buguyy.top/'
                }
            });
            return await res.json();
        }

        function normalizeSong(song) {
            song = song || {};
            const id = text(song.id);
            const name = text(song.title || song.name || '未知歌曲');
            const pic = text(song.picurl || song.pic || '') || PIC;
            const singer = text(song.singer || song.artist || '');
            return {
                id: id,
                name: name,
                pic: pic,
                singer: singer,
                vod_id: 'song@@' + enc(id) + '@@' + enc(name),
                vod_name: name,
                vod_pic: pic,
                vod_remarks: singer || '布谷音乐'
            };
        }

        async function fetchList(url, limit = 20) {
            const data = await requestJson(url);
            const raw = Array.isArray(data.data) ? data.data : (Array.isArray(data.list) ? data.list : (Array.isArray(data) ? data : []));
            return raw.slice(0, Math.max(1, Number(limit) || 20));
        }

        async function fetchSongs(keyword, limit = 20) {
            keyword = text(keyword);
            if (!keyword) return [];
            const data = await requestJson(API_SEARCH + '?keyword=' + enc(keyword) + '&limit=' + (Number(limit) || 20));
            return Array.isArray(data.data) ? data.data : [];
        }

        async function fetchPlayUrl(id) {
            id = text(id);
            if (!id) return '';
            const data = await requestJson(API_URL + '?id=' + enc(id));
            return text(data.url || (data.data && data.data.url) || '');
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ========== 渲染 ==========
        function renderSongs(songs) {
            if (!songs || songs.length === 0) {
                songList.innerHTML = `
                    <div class="empty">
                        <div class="icon">🎵</div>
                        <div>暂无歌曲</div>
                    </div>
                `;
                return;
            }
            currentSongs = songs;
            let html = '';
            songs.forEach((song, index) => {
                html += `
                    <div class="song-item" data-index="${index}">
                        <img class="cover" src="${song.pic || PIC}" alt="" onerror="this.src='${PIC}'">
                        <div class="info">
                            <div class="name">${song.name}</div>
                            <div class="singer">${song.singer || '布谷音乐'}</div>
                        </div>
                        <button class="play-btn" data-index="${index}">▶</button>
                    </div>
                `;
            });
            songList.innerHTML = html;

            // 点击歌曲
            document.querySelectorAll('.song-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.play-btn')) return;
                    const idx = parseInt(this.dataset.index);
                    playSong(idx);
                });
            });
            document.querySelectorAll('.play-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.index);
                    playSong(idx);
                });
            });
        }

        function renderLoading() {
            songList.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>加载中...</div>
                </div>
            `;
        }

        function renderQuickTags() {
            let html = '';
            QUICK_TAGS.forEach(tag => {
                html += `<button data-tag="${tag}">${tag}</button>`;
            });
            quickTags.innerHTML = html;
            quickTags.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', function() {
                    searchInput.value = this.dataset.tag;
                    doSearch(this.dataset.tag);
                });
            });
        }

        // ========== 数据加载 ==========
        async function loadTab(tab, keyword) {
            if (isLoading) return;
            isLoading = true;
            renderLoading();

            try {
                let songs = [];
                if (tab === 'hot') {
                    songs = await fetchList(API_HOTLIST, 30);
                } else if (tab === 'new') {
                    songs = await fetchList(API_NEWLIST, 30);
                } else if (tab === 'search') {
                    const kw = keyword || searchInput.value || '周杰伦';
                    songs = await fetchSongs(kw, 30);
                } else { // random / 默认
                    songs = await fetchList(API_RANDOM, 30);
                }
                const normalized = songs.map(normalizeSong);
                renderSongs(normalized);
                if (normalized.length === 0) {
                    showToast('未找到歌曲');
                }
            } catch (e) {
                console.error(e);
                showToast('加载失败，请重试');
                songList.innerHTML = `
                    <div class="empty">
                        <div class="icon">⚠️</div>
                        <div>加载失败，点击重试</div>
                    </div>
                `;
                songList.querySelector('.empty')?.addEventListener('click', () => loadTab(tab, keyword));
            } finally {
                isLoading = false;
            }
        }

        async function doSearch(keyword) {
            keyword = text(keyword) || searchInput.value || '周杰伦';
            searchInput.value = keyword;
            // 切换到搜索tab
            setActiveTab('search');
            await loadTab('search', keyword);
        }

        // ========== Tab 切换 ==========
        function setActiveTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tabs button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            // 显示/隐藏快速标签
            quickTags.style.display = (tab === 'search') ? 'flex' : 'none';
        }

        // ========== 播放控制 ==========
        async function playSong(index) {
            if (index < 0 || index >= currentSongs.length) return;
            currentIndex = index;
            const song = currentSongs[index];
            if (!song) return;

            playerName.textContent = song.name;
            playerSinger.textContent = song.singer || '布谷音乐';
            playerCover.src = song.pic || PIC;

            // 获取播放链接
            try {
                const url = await fetchPlayUrl(song.id);
                if (url) {
                    audioPlayer.src = url;
                    audioPlayer.play().catch(() => {});
                    isPlaying = true;
                    playPauseBtn.textContent = '⏸';
                    playerBar.classList.add('show');
                } else {
                    showToast('无法获取播放地址');
                }
            } catch (e) {
                showToast('播放失败');
            }
        }

        function togglePlay() {
            if (!audioPlayer.src) {
                if (currentSongs.length > 0 && currentIndex === -1) {
                    playSong(0);
                } else if (currentIndex >= 0) {
                    playSong(currentIndex);
                }
                return;
            }
            if (audioPlayer.paused) {
                audioPlayer.play().catch(() => {});
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
            } else {
                audioPlayer.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            }
        }

        function prevSong() {
            if (currentSongs.length === 0) return;
            const idx = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
            playSong(idx);
        }

        function nextSong() {
            if (currentSongs.length === 0) return;
            const idx = (currentIndex + 1) % currentSongs.length;
            playSong(idx);
        }

        // ========== 事件绑定 ==========
        // 搜索
        searchBtn.addEventListener('click', () => doSearch(searchInput.value));
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch(searchInput.value);
        });

        // Tab切换
        tabContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const tab = btn.dataset.tab;
            setActiveTab(tab);
            loadTab(tab);
        });

        // 播放控制
        playPauseBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        audioPlayer.addEventListener('ended', () => {
            nextSong();
        });

        audioPlayer.addEventListener('play', () => {
            isPlaying = true;
            playPauseBtn.textContent = '⏸';
        });

        audioPlayer.addEventListener('pause', () => {
            isPlaying = false;
            playPauseBtn.textContent = '▶';
        });

        audioPlayer.addEventListener('error', () => {
            showToast('播放出错，尝试下一首');
            nextSong();
        });

        // ========== 初始化 ==========
        renderQuickTags();
        setActiveTab('random');
        loadTab('random');

        // 默认搜索词
        searchInput.value = '周杰伦';

        console.log('🎵 布谷音乐已加载');
    </script>
</body>
</html>
