  var songmid = song.songmid;
  var mediaMid = song.media_mid || song.strMediaMid || song.mediaMid || songmid;
  var midCandidates = [];
  if (mediaMid) midCandidates.push(mediaMid);
  if (songmid && songmid !== mediaMid) midCandidates.push(songmid);

  function parseVkeyResp(d){
    if (!d) return null;
    var data = (d.req_0 && d.req_0.data) || (d.req && d.req.data) || d.data || null;
    if (!data) return null;
    var item = (data.midurlinfo && data.midurlinfo[0]) || null;
    if (!item || !item.purl) return null;
    var domain = (data.sip && data.sip[0]) || "https://dl.stream.qqmusic.qq.com/";
    if (domain.indexOf("http") !== 0) domain = "https://" + domain;
    if (domain.slice(-1) !== "/") domain += "/";
    domain = domain.replace(/^http:/, "https:");
    return domain + item.purl;
  }

  function requestOne(qKey, fileMid){
    var q = qMap[qKey] || qMap.HQ;
    var filename = q.s + fileMid + q.e;
    var body = JSON.stringify({
      req_0: {
        module: "vkey.GetVkeyServer",
        method: "CgiGetVkey",
        param: {
          guid: g,
          songmid: [songmid],
          filename: [filename],
          songtype: [0],

        }

      }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST",
      headers: withCookie({
        "Content-Type": "application/json",
        "Referer": "https://y.qq.com/",
        "Origin": "https://y.qq.com"
      }),
      body: body,
      credentials: "include",
      timeout: 20
    }).then(function(txt){
      return parseVkeyResp(jsonp_safeParse(txt));
    }).catch(function(){ return null; });
  }

  // 备用：UrlGetVkey（部分环境 CgiGetVkey 对绿钻曲返回空 purl）
  function requestUrlGetVkey(qKey, fileMid){
    var q = qMap[qKey] || qMap.HQ;
    var filename = q.s + fileMid + q.e;
    var body = JSON.stringify({
      req_0: {
        module: "music.vkey.GetVkey",
        method: "UrlGetVkey",
        param: {
          guid: g,
          songmid: [songmid],
          filename: [filename],

          platform: "20"
        }
      },
      comm: { uin: Number(uin) || 0, format: "json", ct: 24, cv: 0 }
    });
    return ADAPTER_request("https://u.y.qq.com/cgi-bin/musicu.fcg", {
      method: "POST",
      headers: withCookie({
        "Content-Type": "application/json",
        "Referer": "https://y.qq.com/"
      }),
      body: body,
      credentials: "include",
      timeout: 20
    }).then(function(txt){
      return parseVkeyResp(jsonp_safeParse(txt));
    }).catch(function(){ return null; });
  }

  // 串行：音质 × mid 候选 × 两种 vkey 接口
  var chain = Promise.resolve(null);
  order.forEach(function(qKey){
    midCandidates.forEach(function(mid){
      chain = chain.then(function(got){
        if (got) return got;
        return requestOne(qKey, mid);
      }).then(function(got){
        if (got) return got;
        return requestUrlGetVkey(qKey, mid);
      });
    });
  });
  return chain;
};

function pickMvStreamUrl(info){
  if (!info) return null;
  function joinVkey(u, vkey){
    if (!u) return "";
    u = String(u).trim();
    if (u.indexOf("//") === 0) u = "https:" + u;
    u = u.replace(/^http:/, "https:");
    if (vkey && u.indexOf("vkey=") < 0){
      u += (u.indexOf("?") >= 0 ? "&" : "?") + "vkey=" + encodeURIComponent(vkey);
    }
    return u;
  }
  function collect(arr, out){
    (arr || []).forEach(function(x){
      if (!x || (x.code && x.code !== 0 && x.code !== 1000)) return;
      var urls = [].concat(x.url || [], x.freeflow_url || [], x.comm_url || []);
      var vkey = x.vkey || "";
      urls.forEach(function(u){
        u = joinVkey(u, vkey);
        if (u && /^https?:\/\//i.test(u)) out.push({ u: u, size: Number(x.fileSize || x.filetype || 0) });
      });
      if (x.m3u8){
        var m = joinVkey(x.m3u8, vkey);
        if (m) out.push({ u: m, size: Number(x.fileSize || 0) });
      }
    });
  }
  var cands = [];
  collect(info.mp4, cands);
  collect(info.hls, cands);
  if (!cands.length) return null;
  cands.sort(function(a,b){ return b.size - a.size; });
  return cands[0].u;
}

/* ============================================================
   § 4. 路由 + 全局返回（对齐 Solene）
   ------------------------------------------------------------
   - 首页 = history 第 0 层，URL = pathname+search（不带 #hash）
     原生用 URL 判断「是否主页」；带 #home 会对不上 homePage，无法退出全屏
   - 不垫任何哨兵层；离开首页才 pushState
   - 子页 restoreAffordance:"none"；首页 "auto" 交给 App 退出
   ============================================================ */
var VIEWS = ["home","toplist","playlists","singers","radio","mine","search","detail","singerDetail"];
var MAIN_TABS = ["home","toplist","playlists","singers","radio","mine"];
var _overlayNavLock = false;
var _ignorePop = 0;

function currentHistoryState(extra){
  var base = { view: state.view, params: state.viewParams || {}, qqm: 1 };
  if (extra) {
    for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) base[k] = extra[k];
  }
  return base;
}

function isOverlayOpen(){
  var login = $("#loginView");
  if (login && !login.classList.contains("hidden")) return "login";
  var mv = $("#mvPlayerView");
  if (mv && mv.classList.contains("show")) return "mv";
  var fp = $("#fullPlayer");
  if (fp && fp.classList.contains("show")) return "player";
  return null;
}

function syncAppUnderlay(){
  var app = $("#app");
  if (!app) return;
  if (isOverlayOpen()) app.classList.add("overlay-hidden");
  else app.classList.remove("overlay-hidden");
}

/** Solene: 子页 none（返回走 WebView history）；首页 auto（原生可退出全屏） */
function setSubviewChrome(isSubview){
  try {
    if (window.fm && window.fm.ui && typeof window.fm.ui.setChrome === "function"){
      window.fm.ui.setChrome({
        mode: "edge",
        statusBarStyle: "light",
        navigationBarStyle: "light",
        restoreAffordance: isSubview ? "none" : "auto"
      }).catch(function(){});
    }
  } catch(e) {}
}

function hashFor(name, params){
  params = params || {};
  // 首页必须裸 URL，不能带 #home（Solene 注释：否则原生永远认为还没回主页）
  if (name === "home") return location.pathname + location.search;
  var h = "#"+name;
  if (params.id) h += "/"+params.id;
  if (params.mid) h += "/"+params.mid;
  if (params.kw) h += "/"+encodeURIComponent(params.kw);
  return h;
}

function switchView(name, params, push){
  params = params || {};
  var prev = state.view;
  state.view = name;
  state.viewParams = params;

  VIEWS.forEach(function(v){
    var node = $("#view-"+v);
    if (node) node.classList.toggle("active", v === name);
  });
  $all(".nav-item").forEach(function(n){
    n.classList.toggle("active", n.dataset.view === name);
  });
  var vp = $("#viewport"); if (vp) vp.scrollTop = 0;
  var vnode = $("#view-"+name); if (vnode) vnode.scrollTop = 0;

  if (push !== false){
    var url = hashFor(name, params);
    var st = currentHistoryState({view:name, params:params, overlay:null});
    try {
      if (name === "home"){
        // 回首页只 replace 成裸 URL（真正弹栈由 handleBack / history.back 完成）
        // 禁止在子页上误把当前 entry 直接改成 home，否则 Native 会认为已在主页并退出
        history.replaceState(st, "", url);
      } else if (MAIN_TABS.indexOf(name) > -1){
        if (prev === "home") history.pushState(st, "", url);
        else history.replaceState(st, "", url);
      } else {
        history.pushState(st, "", url);
      }
    } catch(e) {}
  }

  // 首页 auto；其它视图 / 浮层 none
  setSubviewChrome(name !== "home" || !!isOverlayOpen());
  renderView(name, params);
  syncAppUnderlay();
}

function pushOverlayState(kind){
  try {
    history.pushState(currentHistoryState({overlay: kind}), "", location.href);
  } catch(e) {}
  setSubviewChrome(true);
}

function closeOverlayUI(kind){
  if (kind === "login") closeLoginView(true);
  else if (kind === "mv") closeMv(true);
  else if (kind === "player") closeFullPlayer(true);
  setSubviewChrome(state.view !== "home");
  syncAppUnderlay();
}

function tryCloseOverlay(fromPopstate){
  var kind = isOverlayOpen();
  if (!kind) return false;
  // closeOverlayUI 内部会 skipHistory=true，这里统一处理 history
  if (kind === "login") closeLoginView(true);
  else if (kind === "mv") closeMv(true);
  else if (kind === "player") closeFullPlayer(true);
  // 关闭后立刻按当前 view 校正 chrome，避免被 ignore 的 popstate 漏掉
  setSubviewChrome(state.view !== "home");
  syncAppUnderlay();
  if (!fromPopstate){
    _overlayNavLock = true;
    _ignorePop = 1;
    try { history.back(); } catch(e) {}
    setTimeout(function(){ _overlayNavLock = false; }, 150);
  }
  return true;
}

/** 强制回到首页并清洗历史，防止栈深度为 1 时 Native 直接退出 */
function forceGoHome(){
  // 尽量关掉浮层
  try { tryCloseOverlay(true); } catch(e) {}
  try { tryCloseOverlay(true); } catch(e) {}

  state.view = "home";
  state.viewParams = {};
  VIEWS.forEach(function(v){
    var node = $("#view-" + v);
    if (node) node.classList.toggle("active", v === "home");
  });
  $all(".nav-item").forEach(function(n){
    n.classList.toggle("active", n.dataset.view === "home");
  });
  var vp = $("#viewport"); if (vp) vp.scrollTop = 0;
  var vnode = $("#view-home"); if (vnode) vnode.scrollTop = 0;

  try {
    history.replaceState(
      { view: "home", params: {}, qqm: 1, overlay: null },
      "",
      location.pathname + location.search
    );
  } catch(e) {}

  setSubviewChrome(false);
  syncAppUnderlay();
  renderView("home", {});
}

function handleBack(){
  if (tryCloseOverlay(false)) return true;

  if (state.view !== "home"){
    // 优先真弹栈；栈已空或丢失首页层时强制回首页，避免 Native 直接退出
    var canPop = false;
    try {
      canPop = history.length > 1 && !!(history.state && history.state.qqm);
    } catch(e) {}

    if (canPop) {
      try {
        history.back();
        return true;
      } catch(e) {
        canPop = false;
      }
    }

    forceGoHome();
    return true;
  }

  // 首页：不拦截。canGoBack 应为 false，交给原生退出全屏
  return false;
}

window.addEventListener("popstate", function(e){
  if (_ignorePop > 0){
    _ignorePop--;
    _overlayNavLock = false;
    // 即使忽略本次路由切换，也保证 chrome 与当前 state.view 一致
    setSubviewChrome(state.view !== "home" || !!isOverlayOpen());
    syncAppUnderlay();
    return;
  }

  var s = e.state || { view: "home", params: {}, qqm: 1 };
  var open = isOverlayOpen();

  // 浮层已不在 state 里 → 关 DOM
  if (open && !(s && s.overlay === open)){
    if (open === "player") _fpHistoryPushed = false;
    closeOverlayUI(open);
  }

  if (s && s.overlay){
    if (s.overlay === "player") showFullPlayerUI();
    else if (s.overlay === "login"){
      var login = $("#loginView");
      if (login) login.classList.remove("hidden");
    }
    setSubviewChrome(true);
    syncAppUnderlay();
    return;
  }

  var view = (s && s.view && VIEWS.indexOf(s.view) > -1) ? s.view : "home";
  var params = (s && s.params) || {};
  if (view !== state.view || JSON.stringify(params) !== JSON.stringify(state.viewParams||{})){
    switchView(view, params, false);
  } else {
    setSubviewChrome(view !== "home");
    syncAppUnderlay();
  }
});

var IMG_PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">'+
  '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2a22"/><stop offset="100%" stop-color="#0d1512"/></linearGradient></defs>'+
  '<rect width="300" height="300" fill="url(#g)"/>'+
  '<g fill="#FC3C44" opacity="0.35" transform="translate(110,95) scale(3.3)">'+
  '<path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V8h6V5h-2V3z"/></g></svg>'
);
function safeImg(src, cls){
  var raw = src ? fixCover(src) : "";
  var u = raw ? esc(mediaUrl(raw)) : IMG_PLACEHOLDER;
  return '<img src="'+u+'"'+(cls?' class="'+cls+'"':'')+' loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\''+IMG_PLACEHOLDER+'\';">';
}
/** 安全设置 img：失败时加 img-err（露出 CSS 底图）并回退 SVG */
function setImgSrc(el, src, fallbackSrc){
  if (!el) return;
  el.classList.remove("img-err");
  var primary = src ? mediaUrl(fixCover(src)) : "";
  var fallback = fallbackSrc ? mediaUrl(fixCover(fallbackSrc)) : "";
  el.onerror = function(){
    if (fallback && this.dataset.tried !== "1"){
      this.dataset.tried = "1";
      this.src = fallback;
      return;
    }
    this.onerror = null;
    this.classList.add("img-err");
    try{ this.src = IMG_PLACEHOLDER; }catch(e){}
  };
  el.dataset.tried = "0";
  if (!primary){
    el.src = IMG_PLACEHOLDER;
    return;
  }
  el.src = primary;
}

var heroTimer=null, heroIdx=0, heroCount=0;
function goHero(i){
  if (!heroCount) return;
  heroIdx = (i + heroCount) % heroCount;
  var track = $("#heroTrack");
  if (track){
    track.style.transition = "transform .35s var(--ease)";
    track.style.transform = "translateX(-"+(heroIdx*100)+"%)";
  }
  $all(".hero-dot").forEach(function(d,j){ d.classList.toggle("active", j===heroIdx); });
}
function startHeroAuto(n){
  heroCount = n; heroIdx = 0;
  clearInterval(heroTimer);
  if (n <= 1) return;
  heroTimer = setInterval(function(){ goHero(heroIdx + 1); }, 5000);
}
function initHeroSwipe(n){
  var box = $("#heroBox");
  if (!box || !n) return;
  if (box._swipeBound) return;
  box._swipeBound = true;
  startHeroAuto(n);
  var startX=0, startY=0, dx=0, dragging=false, locked=false;
  function onStart(e){
    if (!heroCount) return;
    var t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; dx = 0; dragging = true; locked = false;
    clearInterval(heroTimer);
    var track = $("#heroTrack");
    if (track) track.style.transition = "none";
  }
  function onMove(e){
    if (!dragging) return;
    var t = e.touches ? e.touches[0] : e;
    var adx = t.clientX - startX, ady = t.clientY - startY;
    if (!locked){
      if (Math.abs(ady) > Math.abs(adx) && Math.abs(ady) > 8){ dragging = false; return; }
      if (Math.abs(adx) > 8) locked = true;
    }
    if (!locked) return;
    dx = adx;
    var track = $("#heroTrack");
    if (track){
      var pct = heroIdx * 100 - (dx / box.clientWidth * 100);
      track.style.transform = "translateX(-"+pct+"%)";
    }
    if (e.cancelable) e.preventDefault();
  }
  function onEnd(){
    if (!dragging && !locked){ startHeroAuto(heroCount); return; }
    dragging = false;
    if (Math.abs(dx) > box.clientWidth * 0.18) goHero(heroIdx + (dx < 0 ? 1 : -1));
    else goHero(heroIdx);
    startHeroAuto(heroCount);
  }
  box.addEventListener("touchstart", onStart, { passive: true });
  box.addEventListener("touchmove", onMove, { passive: false });
  box.addEventListener("touchend", onEnd, { passive: true });
  box.addEventListener("touchcancel", onEnd, { passive: true });
  // 点击圆点切换
  box.addEventListener("click", function(e){
    var dot = e.target.closest(".hero-dot");
    if (!dot) return;
    var dots = $all(".hero-dot");
    var i = dots.indexOf(dot);
    if (i >= 0){ clearInterval(heroTimer); goHero(i); startHeroAuto(heroCount); }
  });
}

      '<div class="sec-head" style="margin-top:8px"><button type="button" id="singerBackBtn" style="padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px">‹ 返回</button></div>'+
      '<div class="mine-header">'+
        '<div class="mine-avatar" style="border-radius:50%">'+safeImg(cover)+'</div>'+
        '<div><div class="mine-name">'+esc(displayName)+'</div>'+
        '<div class="mine-uin">'+(songRes.total || songs.length)+' 首热门 · '+albums.length+' 张专辑</div></div>'+
        '<button class="hero-play" id="playAllSinger" style="margin-left:auto"><svg><use href="#i-play"/></svg>播放全部</button>'+
      '</div>'+
      '<div class="sr-tabs" id="singerTabs" style="margin:12px 0;gap:10px">'+
        '<div class="sr-tab active" data-tab="hot">热门歌曲</div>'+
        '<div class="sr-tab" data-tab="album">专辑</div>'+
      '</div>'+
      '<div id="singerBody"></div>';

    var body = $("#singerBody");
    function showHot(){
      if (!songs.length){
        body.innerHTML = emptyHtml("暂无热门歌曲", "可切换到「专辑」浏览");
        return;
      }
      body.innerHTML = '<div class="song-list" id="singerSongs"></div>';
      renderSongList($("#singerSongs"), songs);
    }
    function showAlbums(){
      if (!albums.length){
        body.innerHTML = emptyHtml("暂无专辑", "");
        return;
      }
      // 每个专辑下方自带展开面板，点击就地展开，不跳到底部
      body.innerHTML = albums.map(function(a, i){
        return '<div class="album-block" data-i="'+i+'">'+
          '<div class="song-row singer-album" data-i="'+i+'">'+
            '<div class="song-cover">'+safeImg(a.cover)+'</div>'+
            '<div class="song-meta">'+
              '<div class="song-title">'+esc(a.name)+'</div>'+
              '<div class="song-sub">'+(a.pubTime ? esc(String(a.pubTime).slice(0,10)) : "专辑")+(a.company && a.company !== "未确定" ? " · "+esc(a.company) : "")+'</div>'+
            '</div>'+
            '<span class="album-chevron" style="color:var(--text-2);font-size:16px;padding-right:8px;transition:transform .2s">›</span>'+
          '</div>'+
          '<div class="album-panel" data-i="'+i+'" style="display:none;padding:0 0 8px 12px;border-left:2px solid rgba(var(--accent-rgb),.35);margin:0 12px 6px 18px"></div>'+
        '</div>';
      }).join("");

      $all(".singer-album", body).forEach(function(row){
        row.onclick = function(){
          var i = Number(row.dataset.i);
          var a = albums[i];
          if (!a) return;
          var block = row.closest(".album-block") || row.parentNode;
          var panel = block.querySelector(".album-panel");
          var chev = row.querySelector(".album-chevron");
          if (!panel) return;

          // 已展开：收起
          if (panel.style.display === "block"){
            panel.style.display = "none";
            panel.innerHTML = "";
            row.style.background = "";
            if (chev) chev.style.transform = "";
            return;
          }

          // 收起其它已展开项
          $all(".album-panel", body).forEach(function(p){
            if (p !== panel){ p.style.display = "none"; p.innerHTML = ""; }
          });
          $all(".singer-album", body).forEach(function(x){ x.style.background = ""; });
          $all(".album-chevron", body).forEach(function(c){ c.style.transform = ""; });

          row.style.background = "rgba(var(--accent-rgb),.1)";
          if (chev) chev.style.transform = "rotate(90deg)";
          panel.style.display = "block";
          panel.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 4px 4px">'+
              '<span style="font-size:12px;color:var(--text-2)">加载中…</span>'+
              '<button type="button" class="play-album-btn sec-more" style="border:none;background:none;font-size:13px">播放专辑</button>'+
            '</div>'+
            '<div class="song-list album-song-list">'+skeletonRows(4)+'</div>';

          API.albumSongs(a.mid).then(function(res){
            // 面板可能已被收起/切换
            if (panel.style.display !== "block") return;
            var list = res.songs || [];
            var head = panel.querySelector("span");
            var wrap = panel.querySelector(".album-song-list");
            var pb = panel.querySelector(".play-album-btn");
            if (head) head.textContent = list.length ? (list.length + " 首") : "暂无歌曲";
            if (!wrap) return;
            if (!list.length){ wrap.innerHTML = emptyHtml("专辑暂无歌曲",""); return; }
            renderSongList(wrap, list);
            if (pb) pb.onclick = function(e){ e.stopPropagation(); playQueue(list, 0); };
          });
        };
      });
    }

    showHot();
    $all("#singerTabs .sr-tab").forEach(function(t){
      t.onclick = function(){
        $all("#singerTabs .sr-tab").forEach(function(x){ x.classList.remove("active"); });
        t.classList.add("active");
        if (t.dataset.tab === "album") showAlbums();
        else showHot();
      };
    });
    var playAll = $("#playAllSinger");
    if (playAll) playAll.onclick = function(){ if (songs.length) playQueue(songs, 0); else toast("暂无可播放歌曲"); };
    var sb = $("#singerBackBtn");
    if (sb) sb.onclick = function(){ handleBack(); };
  }).catch(function(){
    v.innerHTML = emptyHtml("加载歌手失败", "请返回重试");
  });
}

   ============================================================ */
function renderDetail(params){
  var v = $("#view-detail");
  v.innerHTML = '<div class="skeleton" style="height:180px;border-radius:24px;margin-top:16px"></div>';
  function paint(res){
    var info = res.info || {};
    var cover = info.cover || info.frontPicUrl || params.cover || "";
    var title = info.title || info.topTitle || params.title || "";
    var songs = res.songs || [];
    v.innerHTML =
      '<div class="sec-head" style="margin-top:8px;align-items:center">'+
        '<button type="button" id="detailBackBtn" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;font-weight:500">‹ 返回</button>'+
      '</div>'+
      '<div class="detail-header">'+
      '<div class="detail-cover">'+safeImg(cover)+'</div>'+
      '<div class="detail-meta">'+
        '<div class="detail-title">'+esc(title)+'</div>'+
        '<div class="detail-sub">'+esc(info.creator||"")+(info.playCount?(' · '+fmtCount(info.playCount)+'次播放'):'')+' · 共'+songs.length+'首</div>'+
        (info.desc?'<div class="detail-desc">'+esc(info.desc)+'</div>':'')+
      '</div>'+
      '<button class="hero-play detail-play-all" id="playAllDetail"><svg><use href="#i-play"/></svg>播放</button></div>'+
      '<div class="song-list" id="detailSongs" style="margin-top:8px"></div>';
    renderSongList($("#detailSongs"), songs);
    $("#playAllDetail").onclick = function(){ playQueue(songs, 0); };
    var db = $("#detailBackBtn");
    if (db) db.onclick = function(){ handleBack(); };
  }
  // 专辑：优先用预载歌曲，否则按 albumMid 拉取
  if (params.type === "album"){
    if (params.songs && params.songs.length){
      paint({ info: { title: params.title || "", cover: params.cover || coverUrl(params.id) }, songs: params.songs });
      return;
    }
    API.albumSongs(params.id).then(function(res){
      paint({ info: { title: params.title || "", cover: (res.info && res.info.cover) || coverUrl(params.id) }, songs: res.songs || [] });
    }).catch(function(){ paint({ info:{}, songs:[] }); });
    return;
  }
  var req = params.type === "toplist" ? API.toplistDetail(params.id) : API.playlistDetail(params.id);
  req.then(paint).catch(function(){ paint({ info:{}, songs:[] }); });
}

function renderSongList(container, songs){
  if (!container) return;
  if (!songs || !songs.length){ container.innerHTML = emptyHtml("没有歌曲",""); return; }
  container.innerHTML = songs.map(function(s,i){
    var isCur = state.queue[state.queueIndex] && state.queue[state.queueIndex].songmid === s.songmid;
    return '<div class="song-row'+(isCur?" playing":"")+'" data-i="'+i+'">'+
      '<div class="song-idx">'+(isCur?'<svg style="width:13px;height:13px;color:var(--green)"><use href="#i-play"/></svg>':(i+1))+'</div>'+
      '<div class="song-meta"><div class="song-title">'+esc(s.name)+(s.isVip?'<span class="tag-vip">VIP</span>':'')+'</div>'+
      '<div class="song-sub">'+esc(s.singer)+(s.albumname?(' - '+esc(s.albumname)):'')+'</div></div>'+
      '<div class="song-dur">'+fmtTime(s.interval)+'</div></div>';
  }).join("");
  $all(".song-row", container).forEach(function(row){
    row.onclick = function(){
      var i = +row.dataset.i;
      playQueue(songs, i);
    };
  });
}

function toggleFavorite(song){
  var i = state.favorites.indexOf(song.songmid);
  if (i>-1){ state.favorites.splice(i,1); toast("已取消收藏"); }
  else { state.favorites.push(song.songmid); toast("已收藏"); }
  storeSet("favorites", state.favorites);
  syncLikeButtons();
}
function syncLikeButtons(){
  var cur = state.queue[state.queueIndex];
  var on = cur && state.favorites.indexOf(cur.songmid) > -1;
  $("#pbLike").classList.toggle("on", !!on);
  $("#fpLike").classList.toggle("on", !!on);
}

/* ============================================================
   § 8. 搜索（热搜 + 输入联想 + 分类结果：单曲/歌手/歌单）
   ============================================================ */
var searchTimer = null;
var _searchSeq = 0;

function unlockAllSources(silent){
  if (state.sourceUnlocked) return;
  state.sourceUnlocked = true;
  storeSet("sourceUnlocked", true);
}
function setMusicSource(src){
  if (!state.sourceUnlocked && src !== "qq") return;

  var allowed = { qq:1, qishui:1, kuwo:1, netease:1 };
  state.source = allowed[src] ? src : "qq";
  storeSet("musicSource", state.source);
  try {
    if (state.source === "qishui") applyTheme("qishui", true);
    else if (state.source === "kuwo") applyTheme("kuwo", true);
    else if (state.source === "qq") applyTheme("qq", true);
  } catch(e) {}
  var si = $("#searchInput");
  if (si){
    si.placeholder = ({
      qishui: "汽水：歌名 / 歌手 / 分享链接",
      kuwo: "酷我：搜索歌曲 / 歌手",
      netease: "网易云：搜索歌曲 / 歌手",
      qq: "搜索歌曲 / 歌手 / 歌单"
    })[state.source] || "搜索歌曲 / 歌手 / 歌单";
  }
}
function renderSourceSwitch(){
  if (!state.sourceUnlocked) return "";
  var src = state.source || "qq";
  var tabs = [
    ["qq","QQ"],
    ["kuwo","酷我"],
    ["netease","网易云"],
    ["qishui","汽水"]
  ];
  return '<div class="sr-tabs" id="sourceTabs" style="margin:8px 0 4px;gap:8px;flex-wrap:wrap">'+
    tabs.map(function(t){
      return '<div class="sr-tab'+(src===t[0]?" active":"")+'" data-src="'+t[0]+'">'+t[1]+'</div>';
    }).join("")+
  '</div>';
}
function bindSourceTabs(root){
  $all("#sourceTabs .sr-tab", root || document).forEach(function(t){
    t.onclick = function(){
      setMusicSource(t.dataset.src);
      $all("#sourceTabs .sr-tab").forEach(function(x){ x.classList.toggle("active", x.dataset.src === state.source); });
      if (state.view === "search"){
        var kw = ($("#searchInput") && $("#searchInput").value.trim()) || (state.viewParams && state.viewParams.kw) || "";
        if (kw) doSearch(kw);
        else renderSearchEmpty();
      }
    };
  });
}
function renderSearchEmpty(){
  var v = $("#view-search");
  if (!v) return;
  var isQs = state.source === "qishui";
  v.innerHTML = '<div class="sec-head" style="margin-top:12px;align-items:center">'+
    '<button type="button" id="searchEmptyBack" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;margin-right:8px">‹ 返回</button>'+
    '<div class="sec-title"><span class="dot"></span>'+(isQs?"汽水搜索":"热搜")+'</div></div>'+
    renderSourceSwitch()+
    (isQs
      ? '<div class="login-hint" style="margin-top:12px">汽水官方接口需设备签名，当前使用公开代理搜索。<br>可粘贴汽水分享链接解析；自定义代理可在下方填写。</div>'+
        '<div style="margin-top:12px;display:flex;gap:8px;align-items:center">'+
          '<input id="qishuiApiInput" placeholder="自定义代理 API（可选）" value="'+esc(state.qishuiApi||"")+'" style="flex:1;padding:10px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:13px">'+
          '<button type="button" id="qishuiApiSave" style="padding:10px 14px;border-radius:10px;background:var(--green);color:#fff;font-size:13px">保存</button>'+
        '</div>'
      : '<div class="hscroll" id="hotTags" style="flex-wrap:wrap;gap:8px;margin-top:8px"></div>'+
        '<div class="login-hint" style="margin-top:16px">输入关键词即可联想 · 按「搜索/回车」查看完整结果</div>');
  var eb = $("#searchEmptyBack");
  if (eb) eb.onclick = function(){ handleBack(); };
  bindSourceTabs(v);
  var save = $("#qishuiApiSave");
  if (save) save.onclick = function(){
    var inp = $("#qishuiApiInput");
    state.qishuiApi = (inp && inp.value.trim()) || "";
    storeSet("qishuiApi", state.qishuiApi);
    toast(state.qishuiApi ? "已保存汽水代理" : "已清除自定义代理");
  };
  if (!isQs){
    API.hotSearch().then(function(tags){
      var wrap = $("#hotTags");
      if (!wrap) return;
      wrap.innerHTML = (tags||[]).map(function(t){ return '<div class="hot-search-tag">'+esc(t)+'</div>'; }).join("");
      $all(".hot-search-tag", v).forEach(function(t){
        t.onclick = function(){
          var sInput = $("#searchInput");
          if (sInput) sInput.value = t.textContent;
          doSearch(t.textContent);
        };
      });
    });
  }
}

/** 输入过程中的智能联想（单曲 / 歌手 / 歌单） */
function renderSearchSuggest(kw){
  kw = (kw || "").trim();
  var v = $("#view-search");
  if (!v) return;
  if (!kw){ renderSearchEmpty(); return; }
  var seq = ++_searchSeq;
  v.innerHTML =
    '<div class="sec-head" style="margin-top:12px;align-items:center">'+
      '<button type="button" id="searchSuggestBack" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:rgba(118,118,128,0.16);color:var(--text-0);font-size:14px;margin-right:8px">‹ 返回</button>'+
      '<div class="sec-title" style="font-size:16px">联想「'+esc(kw)+'」</div>'+
      '<button type="button" id="searchGoFull" style="margin-left:auto;font-size:13px;color:var(--green);padding:4px 10px">完整搜索 ›</button>'+
    '</div>'+
    '<div id="suggestBody"><div class="login-hint" style="padding:20px 0">正在联想…</div></div>';
  var sb = $("#searchSuggestBack");
  if (sb) sb.onclick = function(){ handleBack(); };
  var go = $("#searchGoFull");
  if (go) go.onclick = function(){ doSearch(kw); };

  API.smartbox(kw).then(function(box){
    if (seq !== _searchSeq) return;
    var body = $("#suggestBody");
    if (!body) return;
    var html = "";
    var hasAny = (box.songs && box.songs.length) || (box.singers && box.singers.length) ||
      (box.playlists && box.playlists.length) || (box.albums && box.albums.length);
    if (!hasAny){
      body.innerHTML = '<div class="login-hint" style="padding:16px 0">暂无联想，点右上角「完整搜索」或按回车</div>';
      return;
    }
    if (box.singers && box.singers.length){
      html += '<div class="sec" style="margin-top:8px"><div class="sec-head"><div class="sec-title" style="font-size:16px">歌手</div></div>';
      html += box.singers.slice(0, 6).map(function(s){
        return '<div class="song-row suggest-singer" data-mid="'+esc(s.mid)+'" data-name="'+esc(s.name)+'">'+
          '<div class="song-cover" style="border-radius:50%">'+safeImg(s.cover || coverUrl(s.mid, "singer"))+'</div>'+
          '<div class="song-meta"><div class="song-title">'+esc(s.name)+'</div><div class="song-sub">歌手</div></div></div>';
      }).join("");
      html += '</div>';
    }
    if (box.songs && box.songs.length){
      html += '<div class="sec" style="margin-top:8px"><div class="sec-head"><div class="sec-title" style="font-size:16px">单曲</div></div><div class="song-list" id="suggestSongs"></div></div>';
    }
    if (box.albums && box.albums.length){
      html += '<div class="sec" style="margin-top:8px"><div class="sec-head"><div class="sec-title" style="font-size:16px">专辑</div></div>';
      html += box.albums.slice(0, 6).map(function(a){
        return '<div class="song-row suggest-album" data-mid="'+esc(a.mid)+'" data-name="'+esc(a.name)+'">'+
          '<div class="song-cover">'+safeImg(a.cover)+'</div>'+
          '<div class="song-meta"><div class="song-title">'+esc(a.name)+'</div><div class="song-sub">专辑'+(a.singer?(' · '+esc(a.singer)):'')+'</div></div></div>';
      }).join("");
      html += '</div>';
    }
    if (box.playlists && box.playlists.length){
      html += '<div class="sec" style="margin-top:8px"><div class="sec-head"><div class="sec-title" style="font-size:16px">歌单</div></div>';

function doSearch(kw){
  kw = (kw || "").trim();
  if (!kw) return;
  if (kw === "宝宝巴士" || kw.replace(/\s+/g,"") === "宝宝巴士"){
    unlockAllSources(true);
  }
  // 汽水分享链接
  if (/qishui\.douyin\.com|music\.douyin\.com\/qishui|track_id=\d+/i.test(kw)){
    setMusicSource("qishui");
    if (state.view !== "search") switchView("search", {kw:kw});
    else {
      state.viewParams = { kw: kw };
      try { history.replaceState(currentHistoryState({view:"search", params:{kw:kw}}), "", "#search/"+encodeURIComponent(kw)); } catch(e) {}
    }
    renderQishuiLinkResult(kw);
    return;
  }

    state.viewParams = { kw: kw };
    try {
      history.replaceState(currentHistoryState({view:"search", params:{kw:kw}}), "", "#search/"+encodeURIComponent(kw));
    } catch(e) {}
    renderSearchResults(kw);
    return;
  }
  switchView("search", {kw:kw});
}

    pushOverlayState("mv");

  mvEl.classList.add("show");
  syncAppUnderlay();
  $("#mvTopTitle").textContent = (mv.title || "MV") + (mv.singer ? ("  ·  " + mv.singer) : "");
  var video = $("#mvVideo");
  if (!video) return;
  try{ video.pause(); }catch(e){}

  video.poster = fixCover(mv.cover || "") || "";
  toast("正在解析MV地址…", 1500);
  API.mvUrl(mv.vid).then(function(url){
    if (!url){
      toast("MV解析失败，请登录后重试或换一个MV");
      return;
    }
    // 页内 <video> 播放；不走 fm.play/webResource（易出现网络读取失败）
    var playSrc = url;
    try{
      if (window.fm && typeof window.fm.res === "function"){
        var proxied = window.fm.res(url, {
          headers: withCookie({ "Referer": "https://y.qq.com/", "User-Agent": QQ_HEADERS["User-Agent"] }),
          credentials: "include"
        });
        if (proxied) playSrc = proxied;
      }
    }catch(e1){}
    video.src = playSrc;
    var p = video.play();
    if (p && typeof p.then === "function"){
      p.catch(function(err){
        console.warn("mv play fail", err);
        // 代理失败回退直链
        if (playSrc !== url){
          video.src = url;
          video.play().catch(function(){
            toast("MV播放失败，可能被防盗链限制");
          });
        } else {
          toast("MV播放失败，可能被防盗链限制");
        }
      });
    }
  });

var audio = $("#audioEl");
audio.volume = state.volume;
// 尝试允许跨域分析（部分音源可出真实频谱；失败则回退假动画）
try { audio.crossOrigin = "anonymous"; } catch(e) {}

/* ---- WebAudio 真实频谱 ---- */
var _audioCtx = null, _analyser = null, _freqData = null, _vizRaf = 0, _vizLive = false;

function ensureAudioGraph(){
  if (_analyser) return true;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    _audioCtx = new AC();
    var src = _audioCtx.createMediaElementSource(audio);
    _analyser = _audioCtx.createAnalyser();
    _analyser.fftSize = 256;
    _analyser.smoothingTimeConstant = 0.72;
    _analyser.minDecibels = -78;
    _analyser.maxDecibels = -18;
    src.connect(_analyser);
    _analyser.connect(_audioCtx.destination);
    _freqData = new Uint8Array(_analyser.frequencyBinCount);
    _vizLive = true;
    return true;
  } catch(e) {
    console.warn("[qqm] analyser init fail", e);
    _vizLive = false;
    return false;
  }
}

function resumeAudioCtx(){
  try {
    if (_audioCtx && _audioCtx.state === "suspended") _audioCtx.resume();
  } catch(e) {}
}

function startVizLoop(){
  if (_vizRaf) return;
  function tick(){
    _vizRaf = requestAnimationFrame(tick);
    updateFpVisualizer();
  }
  _vizRaf = requestAnimationFrame(tick);
}

function stopVizLoop(){
  // 保持 rAF 跑着也行；暂停时压低柱子
}

function updateFpVisualizer(){
  var art = $("#fpArt");
  if (!art) return;
  var style = art.getAttribute("data-style") || "vinyl";
  var need = (style === "spectrum" || style === "wave" || style === "pulse" || style === "ring");
  if (!need) return;

  var live = false;
  var avg = 0.2;
  if (_analyser && _freqData && !audio.paused){
    try {
      _analyser.getByteFrequencyData(_freqData);
      live = true;
      var sum = 0, n = _freqData.length;
      for (var i = 0; i < n; i++) sum += _freqData[i];
      avg = sum / (n * 255);
    } catch(e) { live = false; }
  }
  art.classList.toggle("is-fake", !live);
  if (!live) return;

  if (style === "spectrum"){
    var bars = art.querySelectorAll("#fpSpectrum i");
    var bn = bars.length;
    if (!bn) return;
    var len = _freqData.length;
    // 环形声波：对称镜像 + 平滑邻域，看起来像一圈震动波
    var levels = [];
    for (var j = 0; j < bn; j++){
      var idx = Math.min(len - 1, Math.floor((j % Math.floor(bn/2)) / (bn/2) * len * 0.5) + 1);
      levels[j] = _freqData[idx] / 255;
    }
    // 简单平滑
    for (var p = 0; p < 2; p++){
      var next = levels.slice();
      for (var j2 = 0; j2 < bn; j2++){
        var a = levels[(j2 - 1 + bn) % bn], b = levels[j2], c = levels[(j2 + 1) % bn];
        next[j2] = a * 0.2 + b * 0.6 + c * 0.2;
      }
      levels = next;
    }
    var peak = 0;
    for (var j3 = 0; j3 < bn; j3++){
      var v = levels[j3];
      if (v > peak) peak = v;
      // 0.2~1.8 的径向伸缩 = 声波起伏
      var scale = 0.22 + v * 1.65;
      bars[j3].style.transform = "var(--tr) scaleY(" + scale.toFixed(3) + ")";
      bars[j3].style.opacity = String(0.35 + v * 0.65);
    }
    var glow = $("#fpSpectrumGlow");
    if (glow){
      var g = 1 + peak * 0.08;
      glow.style.transform = "scale(" + g.toFixed(3) + ")";
      glow.style.opacity = String(0.35 + peak * 0.5);
    }
  } else if (style === "wave"){
    var wb = art.querySelectorAll("#fpWave b");
    var wn = wb.length;
    if (!wn) return;
    var len2 = _freqData.length;
    for (var k = 0; k < wn; k++){
      var idx2 = Math.min(len2 - 1, Math.floor(k / wn * len2 * 0.65));
      var v2 = _freqData[idx2] / 255;
      // 中间更高一点
      var mid = 1 - Math.abs(k / (wn - 1) - 0.5) * 1.1;
      var scale2 = 0.12 + v2 * 0.95 * (0.55 + mid * 0.45);
      wb[k].style.transform = "scaleY(" + scale2.toFixed(3) + ")";
    }
  } else if (style === "pulse"){
    var rings = art.querySelectorAll(".fp-pulse-ring");
    var sc = 0.92 + avg * 0.22;
    for (var r = 0; r < rings.length; r++){
      rings[r].style.transform = "scale(" + (sc + r * 0.04).toFixed(3) + ")";
      rings[r].style.opacity = String(Math.max(0.15, 0.55 - avg * 0.2 - r * 0.1));
    }
  } else if (style === "ring"){
    var rs = art.querySelector(".fp-ring-spin");
    if (rs){
      rs.style.borderTopWidth = (2 + avg * 4).toFixed(1) + "px";
      rs.style.opacity = String(0.55 + avg * 0.45);
    }
  }
}

function loadCurrent(){
  var s = state.queue[state.queueIndex];
  if (!s) return;
  ensurePlayerBarVisible();
  try { initFpArtStyle(); } catch(e) {}
  // 切歌后重新钉住全屏播放器 history，避免返回直接退出 App 全屏
  try {
    var fp = $("#fullPlayer");
    if (fp && fp.classList.contains("show")) ensurePlayerHistory();
  } catch(e0) {}
  updatePlayerMeta(s);
  syncLikeButtons();
  var urlPromise;
  if (s.playUrl){
    urlPromise = Promise.resolve(s.playUrl);
  } else if (s.source === "kuwo"){
    // 酷我与 QQ 并行取链，优先酷我，失败立刻用 QQ
    urlPromise = Promise.all([
      API.kuwoUrl(s).catch(function(){ return null; }),
      API.fallbackViaQQ(s).catch(function(){ return null; })
    ]).then(function(arr){ return arr[0] || arr[1] || null; });
  } else if (s.source === "netease"){
    urlPromise = API.neteaseUrl(s).then(function(url){
      if (url) return url;
      return API.fallbackViaQQ(s);
    });
  } else if (s.source === "qishui"){
    urlPromise = Promise.resolve(s.playUrl || null).then(function(url){
      if (url) return url;
      return API.fallbackViaQQ(s);
    });
  } else {
    urlPromise = API.songUrl(s);
  }
  if (s.source === "qishui" && s.lyricText){
    try {
      state.currentLyrics = parseLrc(s.lyricText, "");
      renderLyrics();
    } catch(e) {}
  }
  urlPromise.then(function(url){
    if (!url){
      if (s.source === "qishui") toast("汽水暂无可用播放地址。可配置自定义代理后重试", 3200);
      else if (s.source === "kuwo") toast("酷我暂无播放地址，换一首试试", 2800);
      else if (s.source === "netease") toast("网易云直链获取失败（部分曲目需自建 API / 登录）", 3200);
      else toast((s.isVip ? "VIP 曲目，" : "") + "无法获取播放地址。请确认已用 Cookie 登录，或切换 HQ 音质重试", 3200);
      setPlayingUI(false);
      return;
    }
    // 听歌：固定在本页 <audio> 播放，不跳转原生播放器（MV 才走原生/视频页）
    try{
      // 带 Referer 的资源网关，减少防盗链失败
      var playSrc = url;
      try{
        if (window.fm && typeof window.fm.res === "function"){
          var ref = s.source === "qishui" ? "https://music.douyin.com/"
            : s.source === "kuwo" ? "https://www.kuwo.cn/"
            : s.source === "netease" ? "https://music.163.com/"
            : "https://y.qq.com/";
          playSrc = window.fm.res(url, {
            headers: withCookie({ "Referer": ref }),
            credentials: "include"
          }) || url;
        }
      }catch(e1){}
      audio.src = playSrc;
      var p = audio.play();
      if (p && typeof p.then === "function"){
        p.then(function(){ setPlayingUI(true); })
         .catch(function(e){
           console.warn("audio.play blocked", e);
           // 网关失败时回退直链再试一次
           if (playSrc !== url){
             audio.src = url;
             audio.play().then(function(){ setPlayingUI(true); }).catch(function(){
               toast("本页播放失败，可点歌词页外的列表重试");
               setPlayingUI(false);
             });
           } else if (s.source && s.source !== "qq" && !s._fbTried){
             s._fbTried = 1;
             API.fallbackViaQQ(s).then(function(fb){
               if (!fb){ toast("播放失败"); setPlayingUI(false); return; }
               audio.src = fb;
               audio.play().then(function(){ setPlayingUI(true); }).catch(function(){
                 toast("播放失败"); setPlayingUI(false);
               });
             });
           } else {
             toast("播放被拦截，请检查系统静音或登录态");
             setPlayingUI(false);
           }
         });
      } else {
        setPlayingUI(true);
      }
    }catch(e){
      toast("播放失败");
      setPlayingUI(false);
    }
  });
  // 非 QQ 源不要走 QQ 歌词接口（会把已加载歌词盖成空）
  if (!s.source || s.source === "qq"){
    API.lyric(s.songmid).then(function(res){
      state.currentLyrics = parseLrc(res.lyric, res.trans);
      renderLyrics();
    });
  } else if (s.source === "netease"){
    var neId = s.neteaseId || String(s.songmid || "").replace(/^ne_/, "");
    API.neteaseLyric(neId).then(function(ly){
      state.currentLyrics = parseLrc((ly && ly.lyric) || "", (ly && ly.trans) || "");
      renderLyrics();
    });
  } else if (s.source === "qishui" && s.lyricText){
    state.currentLyrics = parseLrc(s.lyricText, "");
    renderLyrics();
  } else {
    state.currentLyrics = [];
    renderLyrics();
  }
  highlightPlayingRow();
}

var FP_ART_STYLES = [
  { id: "vinyl", name: "黑胶" },
  { id: "spectrum", name: "频谱" },
  { id: "pulse", name: "脉冲" },
  { id: "square", name: "方封" },
  { id: "wave", name: "波形" },
  { id: "ring", name: "光环" }
];
function ensureFpArtDecor(){
  var art = $("#fpArt");
  var stage = art && art.querySelector(".fp-art-stage");
  var spec = $("#fpSpectrum");
  // 半径：封面外一圈（舞台宽度的一半略大一点）
  var radius = 100;
  if (stage && stage.offsetWidth) radius = Math.round(stage.offsetWidth * 0.46);
  if (spec){
    var n = 80, html = "";
    for (var i = 0; i < n; i++){
      var rot = (i / n) * 360;
      var delay = (i % 12) * 0.04;
      // 从圆心旋到角度后，沿 Y 推到封面外缘，scaleY 控制声波长短
      html += '<i style="--tr:rotate('+rot+'deg) translateY(-'+radius+'px);transform:var(--tr) scaleY(.3);animation-delay:'+delay+'s"></i>';
    }
    spec.innerHTML = html;
  }
  var wave = $("#fpWave");
  if (wave && !wave.childNodes.length){
    var w = "";
    for (var j = 0; j < 24; j++){
      var d2 = (j % 7) * 0.06;
      w += '<b style="transform:scaleY(.15);animation-delay:'+d2+'s"></b>';
    }
    wave.innerHTML = w;
  }
}

  }

  // reset all
  if (groove) groove.style.display = "none";

      vinyl.style.background = "transparent";

    }

      img.style.height = "88%";
      img.style.border = "none";

    }
  } else if (st.id === "wave"){

      img.style.border = "none";

  }

  var hint = $("#fpArtHint");
  if (hint) hint.textContent = st.name + " · 点击切换";
  try { storeSet("fpArtStyle", st.id); } catch(e) {}
  // 同步播放旋转状态

    setPlayingUI(playing);
    if (playing){ ensureAudioGraph(); resumeAudioCtx(); startVizLoop(); }
    updateFpVisualizer();
  } catch(e2) {}
}

/* ---------- 歌词解析与滚动同步 ---------- */
function parseLrc(lrc, trans){
  if (!lrc) return [];
  var transMap = {};
  (trans||"").split("\n").forEach(function(line){
    var m = /\[(\d{2}):(\d{2})[.:](\d{2,3})\]([\s\S]*)/.exec(line);
    if (m) transMap[(+m[1]*60+ +m[2]).toFixed(0)] = m[4].trim();
  });
  var out = [];
  lrc.split("\n").forEach(function(line){
    var m = /\[(\d{2}):(\d{2})[.:](\d{2,3})\]([\s\S]*)/.exec(line);
    if (!m) return;
    var t = +m[1]*60 + +m[2] + (+m[3]/(m[3].length===3?1000:100));
    var text = m[4].trim();
    if (!text) return;
    out.push({ time:t, text:text, tr: transMap[Math.round(+m[1]*60+ +m[2])] || "" });
  });
  return out.sort(function(a,b){ return a.time-b.time; });
}
function renderLyrics(){
  var wrap = $("#lyricsList");
  if (!state.currentLyrics.length){ wrap.innerHTML = '<div class="empty-state"><div class="e-title">暂无歌词</div></div>'; return; }
  wrap.innerHTML = state.currentLyrics.map(function(l,i){
    return '<div class="lyric-line" data-i="'+i+'" data-t="'+l.time+'">'+esc(l.text)+(l.tr?'<span class="lyric-tr">'+esc(l.tr)+'</span>':'')+'</div>';
  }).join("");
  $all(".lyric-line", wrap).forEach(function(l){ l.onclick = function(){ audio.currentTime = +l.dataset.t; audio.play(); }; });
}

  lastLyricIdx = idx;
  $all(".lyric-line").forEach(function(l){ l.classList.remove("active"); });

  if (active){
    active.classList.add("active");
    var wrap = $("#lyricsWrap");
    wrap.scrollTop = active.offsetTop - wrap.clientHeight/2 + active.clientHeight/2;
  }
}

/* ---------- 专辑色彩提取 → 呼吸背景（signature element） ---------- */
var _colorCanvas = document.createElement("canvas"); _colorCanvas.width=16; _colorCanvas.height=16;
var _colorCtx = _colorCanvas.getContext("2d", {willReadFrequently:true});
/** 取色后压到中低亮度，保持饱和但不刺眼 */
function _boostColor(r, g, b){
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var mid = (max + min) / 2;
  var sat = max === min ? 0 : (max - min) / (255 - Math.abs(2*mid - 255) || 1);
  var targetSat = Math.min(0.85, sat * 1.2 + 0.12);
  // 控制在偏暗区间，避免上半屏过亮
  var targetLum = Math.max(48, Math.min(110, mid * 0.75 + 20));
  function ch(c){
    var v = mid + (c - mid) * (targetSat / (sat || 0.01));
    v = v * (targetLum / (mid || 1));
    return Math.max(0, Math.min(255, Math.round(v)));
  }
  return "rgb("+ch(r)+","+ch(g)+","+ch(b)+")";
}
function themeAmbientColors(){
  var t = state.theme || "apple";
  // 偏暗色相，避免上半屏过亮
  if (t === "qq") return ["#1a7a55", "#145868", "#2a3f88"];
  if (t === "kuwo") return ["#a87818", "#8a5a18", "#3d2f6a"];
  if (t === "qishui") return ["#0a7a6e", "#0d5c68", "#1e3a5c"];
  return ["#8a3038", "#4a2f6e", "#1e3458"];
}
function extractAmbientColor(url){
  if (!url){ applyAmbient(themeAmbientColors()); return; }
  var img = new Image();
  img.crossOrigin = "anonymous";
  var fallback = true;
  var tm = setTimeout(function(){ if (fallback) applyAmbient(themeAmbientColors()); }, 900);
  img.onload = function(){
    fallback = false; clearTimeout(tm);
    try{
      if (!_colorCtx){ applyAmbient(themeAmbientColors()); return; }
      _colorCtx.drawImage(img,0,0,16,16);
      var data = _colorCtx.getImageData(0,0,16,16).data;
      var buckets = {};
      for (var i=0;i<data.length;i+=4){
        var r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
        if (a < 200) continue;
        if (r+g+b < 50 || r+g+b > 700) continue;
        var key = (r>>4)+","+(g>>4)+","+(b>>4);
        buckets[key] = (buckets[key]||0)+1;
      }
      var sorted = Object.keys(buckets).sort(function(a,b){ return buckets[b]-buckets[a]; });
      var top = sorted.slice(0,3).map(function(k){
        var p = k.split(",").map(function(n){ return (+n)<<4; });
        return _boostColor(p[0], p[1], p[2]);
      });
      var defaults = themeAmbientColors();
      while (top.length<3) top.push(defaults[top.length] || defaults[0]);
      applyAmbient(top);
    }catch(e){ applyAmbient(themeAmbientColors()); }
  };
  img.onerror = function(){ fallback=false; clearTimeout(tm); applyAmbient(themeAmbientColors()); };
  img.src = url;
}
function applyAmbient(colors){
  var bg = $("#ambientBg");
  if (!bg) return;
  bg.style.setProperty("--c1", colors[0]);
  bg.style.setProperty("--c2", colors[1] || colors[0]);
  bg.style.setProperty("--c3", colors[2] || colors[0]);
}

/* ============================================================
   § 11. 登录
   ------------------------------------------------------------
   三种方式：
   1) 账号密码 —— 腾讯对第三方密码登录有滑块/设备风控，
      此处按标准 ptlogin 流程发起请求，若被拦截会提示改用其它方式。
   2) 扫码登录 —— 标准 QQ 互联二维码轮询流程（ptqrshow / ptqrlogin），
      依赖原生端保持同一 Cookie 会话，真机联调时请重点验证这一步。
   3) Cookie 登录 —— 最稳妥，用户从已登录的浏览器会话粘贴 Cookie。
   ============================================================ */
function parseCookieStr(str){
  var map = {};
  str.split(/;\s*/).forEach(function(kv){
    var idx = kv.indexOf("=");
    if (idx<0) return;
    map[kv.slice(0,idx).trim()] = kv.slice(idx+1).trim();
  });
  return map;
}
function applyLogin(cookieStr, uinOverride){
  var map = parseCookieStr(cookieStr);
  var uin = uinOverride || map.uin || map.p_uin || "";
  uin = uin.replace(/^o0*/,"");
  if (!uin || !(map.qqmusic_key || map.qm_keyst || map.skey)){
    toast("Cookie 中未识别到有效登录态（需包含 uin 与 qqmusic_key/qm_keyst）");
    return false;
  }
  // 规范化 Cookie：保证含 uin=oXXXX 形式（部分接口依赖）
  var ck = cookieStr;
  if (uin && !/(?:^|;\s*)uin=/.test(ck)){
    ck = "uin=o" + uin + "; " + ck;
  }
  state.user = {
    uin: uin,
    cookie: ck,
    nickname: "QQ音乐用户 "+uin,
    avatar: avatarUrl(uin),
    vip: false,
    qqmusic_key: map.qqmusic_key || "",
    qm_keyst: map.qm_keyst || ""
  };
  storeSet("user", state.user);
  toast("登录成功");
  closeLoginView(false);
  syncUserAvatar();
  renderMine();
  fetchUserVipStatus();
  fetchUserProfile();
  return true;
}
function fetchUserVipStatus(){
  // 登录后查询绿钻状态（失败不影响已登录状态）
  var url = "https://c.y.qq.com/v8/fcg-bin/fcg_v8_grocery_svip_getprivilegeindex_out.fcg?loginUin="+(state.user&&state.user.uin)+"&format=json";
  ADAPTER_request(url, {headers:withCookie()}).then(function(txt){
    var d = jsonp_safeParse(txt);
    if (d && d.data && (d.data.is_vip===1 || d.data.svip===1)){
      state.user.vip = true; storeSet("user", state.user); renderMine();
    }
  }).catch(function(){});
}
/** 拉取昵称 / 头像（接口失败时仍用 qlogo 兜底） */
function fetchUserProfile(){
  if (!state.user || !state.user.uin) return;
  var uin = String(state.user.uin).replace(/^o0*/,"");
  var url = "https://c.y.qq.com/rsc/fcgi-bin/fcg_get_profile_homepage.fcg?cid=205360838&ct=20&userid="+encodeURIComponent(uin)+"&reqfrom=1&reqtype=0&format=json";
  ADAPTER_request(url, {headers:withCookie()}).then(function(txt){
    var d = jsonp_safeParse(txt);
    if (!d || !d.data) return;
    var info = d.data && (d.data.creator || d.data.userInfo || d.data);
    var nick = (info && (info.nick || info.nickname || info.name)) || (d.data.nickname) || "";
    var head = (info && (info.headpic || info.headurl || info.avatar || info.headIcon)) || "";
    var changed = false;
    if (nick){ state.user.nickname = nick; changed = true; }
    if (head){ state.user.avatar = fixCover(head); changed = true; }
    if (changed){
      storeSet("user", state.user);
      syncUserAvatar();
      if (state.view === "mine") renderMine();
    }
  }).catch(function(){});
}

/* ---------- 扫码登录（QQ互联标准流程） ---------- */
var qrPollTimer = null, qrSig = "";
function startQrLogin(){
  clearInterval(qrPollTimer);
  $("#qrMask").classList.remove("show");
  var t = Date.now();
  var url = "https://ssl.ptlogin2.qq.com/ptqrshow?appid=716027609&e=2&l=M&s=3&d=72&v=4&t="+Math.random()+"&daid=383&pt_3rd_aid=100497308";
  ADAPTER_request(url, {headers:{}}).then(function(resp){
    // 期望原生端返回 {body: base64图片, headers:{'set-cookie': 'qrsig=...'}} 或直接给出可用的 <img> 数据URI。
    drawQrFallback(); // 若原生未按预期返回结构化数据，退化为提示用户使用APP内「登录设备管理」扫描本机专属链接
    qrPollTimer = setInterval(pollQrStatus, 2500);
    setTimeout(function(){ clearInterval(qrPollTimer); $("#qrMask").classList.add("show"); }, 120000);
  }).catch(function(){
    drawQrFallback();
  });
}
function drawQrFallback(){
  var ctx = $("#qrCanvas").getContext("2d");
  ctx.fillStyle = "#111"; ctx.fillRect(0,0,160,160);
  ctx.fillStyle = "#fff"; ctx.font = "12px sans-serif"; ctx.textAlign="center";
  ctx.fillText("请在真机环境", 80, 70);
  ctx.fillText("联调二维码渲染", 80, 90);
}
function pollQrStatus(){
  var url = "https://ssl.ptlogin2.qq.com/ptqrlogin?u1=https%3A%2F%2Fy.qq.com%2F&ptqrtoken="+qrSig+
    "&ptredirect=0&h=1&t=1&g=1&from_ui=1&ptlang=2052&action=0-0-"+Date.now()+"&js_ver=20102616&js_type=1&pt_uistyle=40&aid=716027609&daid=383&&pt_3rd_aid=100497308";
  ADAPTER_request(url, {headers:{}}).then(function(txt){
    if (/ptuiCB\('0'/.test(txt)){
      // 扫码成功，txt 中包含跳转 URL，据此换取最终 Cookie（需原生端在跟随重定向时保留 Set-Cookie）
      clearInterval(qrPollTimer);
      toast("扫码成功，正在登录…");
      // 实际 Cookie 通常由原生端在重定向链路中自动落盘；此处尝试直接读取原生 CookieManager（如可用）
      if (window.fm && typeof window.fm.getCookie === "function"){
        var ck = window.fm.getCookie("y.qq.com");
        if (ck) applyLogin(ck);
        else toast("未获取到登录 Cookie，请改用「Cookie登录」手动粘贴");
      } else {
        toast("请改用「Cookie登录」标签页，从浏览器或登录态路径中粘贴完整 Cookie 完成登录");
      }
    } else if (/ptuiCB\('65'/.test(txt)){
      clearInterval(qrPollTimer); $("#qrMask").classList.add("show");
    }
  }).catch(function(){});
}

/* ============================================================
   § 12. 事件绑定
   ============================================================ */
function bindEvents(){
  $all(".nav-item").forEach(function(n){ n.onclick = function(){ switchView(n.dataset.view); }; });

  // Logo 长按切换全局主题色：苹果红 → QQ绿 → 酷我黄
  (function bindThemeLongPress(){
    var mark = $("#brandMark");
    if (!mark || mark._themeBound) return;
    mark._themeBound = true;
    var tm = null, moved = false, startX = 0, startY = 0;
    function clear(){ if (tm){ clearTimeout(tm); tm = null; } }
    function onStart(e){
      moved = false;
      var t = e.touches ? e.touches[0] : e;
      startX = t.clientX; startY = t.clientY;
      clear();
      tm = setTimeout(function(){
        tm = null;
        cycleTheme();
        try { if (navigator.vibrate) navigator.vibrate(30); } catch(err) {}
      }, 480);
    }
    function onMove(e){
      if (!tm) return;
      var t = e.touches ? e.touches[0] : e;
      if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10){
        moved = true;
        clear();
      }
    }
    function onEnd(){ clear(); }
    mark.addEventListener("touchstart", onStart, { passive: true });
    mark.addEventListener("touchmove", onMove, { passive: true });
    mark.addEventListener("touchend", onEnd, { passive: true });
    mark.addEventListener("touchcancel", onEnd, { passive: true });
    mark.addEventListener("mousedown", onStart);
    mark.addEventListener("mousemove", onMove);
    mark.addEventListener("mouseup", onEnd);
    mark.addEventListener("mouseleave", onEnd);
    // 单击也可切换（桌面方便）；移动端以长按为主，短按不触发主题
    mark.addEventListener("click", function(e){
      if (moved) return;
      // 仅桌面指针设备用单击切换，避免误触
      if (window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches){
        cycleTheme();
      }
    });
  })();

  var sInput = $("#searchInput"), sBox = $("#searchBox");
  // 整块点击：先进入搜索页再聚焦，避免首点被 switchView 抢走焦点/键盘
  if (sBox && !sBox._qqmBound){
    sBox._qqmBound = true;
    sBox.addEventListener("click", function(e){
      if (state.view !== "search"){
        openSearchPage();
        setTimeout(function(){
          try { sInput.focus(); } catch(err) {}
        }, 80);
      } else {
        try { sInput.focus(); } catch(err) {}
      }
    });
  }
  sInput.addEventListener("focus", function(){
    sBox.classList.add("focused");
    if (state.view !== "search"){
      openSearchPage();
    } else if (!(state.viewParams && state.viewParams.kw) && !sInput.value.trim()){
      renderSearchEmpty();
    }
  });
  sInput.addEventListener("blur", function(){ sBox.classList.remove("focused"); });
  // 输入时：清空回热搜；有字防抖联想（不 push 历史）
  sInput.addEventListener("input", function(){
    var kw = sInput.value.trim();
    if (state.view !== "search"){
      openSearchPage();
      // 打开搜索页后再联想
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function(){
        if (kw) renderSearchSuggest(kw);
        else renderSearchEmpty();
      }, 280);
      return;
    }
    if (!kw){
      state.viewParams = {};
      try { history.replaceState(currentHistoryState({view:"search", params:{}}), "", "#search"); } catch(e) {}
      clearTimeout(searchTimer);
      renderSearchEmpty();
      return;
    }
    // 有字：防抖联想，不改 history，避免删字触发返回栈变化
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      renderSearchSuggest(kw);
    }, 280);
  });
  sInput.addEventListener("keydown", function(e){
    if (e.key === "Enter"){
      e.preventDefault();
      clearTimeout(searchTimer);
      doSearch(sInput.value);
      try { sInput.blur(); } catch(err) {}
    }
    // Escape：仅失焦，不返回（删字/取消输入）
    if (e.key === "Escape"){
      e.preventDefault();
      try { sInput.blur(); } catch(err) {}
    }
  });

  $("#avatarBtn").onclick = function(){
    if (state.user && state.user.uin){
      switchView("mine", {}, true);
    } else {
      openLoginView();
    }
  };

  // player bar
  function togglePlay(){
    if (!state.queue.length){ toast("先选择一首歌曲吧"); return; }
    if (audio.paused) audio.play().catch(function(){}); else audio.pause();
  }
  $("#pbPlay").onclick = togglePlay;
  $("#pbPrev").onclick = prevTrack;
  $("#pbNext").onclick = function(){ nextTrack(false); };
  $("#pbModeBtn").onclick = cycleMode;
  var fpMode = $("#fpModeBtn");
  if (fpMode) fpMode.onclick = cycleMode;
  $("#pbLike").onclick = function(){ var s=state.queue[state.queueIndex]; if (s) toggleFavorite(s); };
  $("#fpLike").onclick = function(){ var s=state.queue[state.queueIndex]; if (s) toggleFavorite(s); };
  $("#fpAdd").onclick = function(){ toast("已添加到「我喜欢」"); var s=state.queue[state.queueIndex]; if (s && state.favorites.indexOf(s.songmid)<0) toggleFavorite(s); };
  $("#fpDownload").onclick = function(){ toast("受版权保护，暂不支持下载"); };
  var fpPlayBtn = $("#fpPlay"), fpPrevBtn = $("#fpPrev"), fpNextBtn = $("#fpNext");
  if (fpPlayBtn) fpPlayBtn.onclick = togglePlay;
  if (fpPrevBtn) fpPrevBtn.onclick = prevTrack;
  if (fpNextBtn) fpNextBtn.onclick = function(){ nextTrack(false); };
  $("#pbQuality").onclick = function(){
    var order = ["HQ","SQ","ZQ"]; var idx = (order.indexOf(state.quality)+1)%order.length;
    state.quality = order[idx]; storeSet("quality", state.quality); $("#pbQuality").textContent = state.quality;
    toast("音质切换为 "+state.quality+"，重新加载当前曲目", 1400);
    if (state.queue[state.queueIndex]) loadCurrent();
  };

  // progress bar drag（迷你栏 + 全屏播放器）
  var draggingBar = false, activeSeekBar = null;
  function seekFromEvent(e, barEl){
    var bar = barEl || activeSeekBar || $("#pbBar");
    if (!bar) return;
    var rect = bar.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    var d = audio.duration || (state.queue[state.queueIndex]&&state.queue[state.queueIndex].interval) || 0;
    if (d) audio.currentTime = pct * d;
    updateProgressUI(pct * d, d);
  }
  function bindSeekBar(bar){
    if (!bar) return;
    bar.addEventListener("mousedown", function(e){ draggingBar=true; activeSeekBar=bar; seekFromEvent(e, bar); });
    bar.addEventListener("touchstart", function(e){ draggingBar=true; activeSeekBar=bar; seekFromEvent(e, bar); e.preventDefault(); }, {passive:false});
    bar.addEventListener("touchmove", function(e){ if (draggingBar){ seekFromEvent(e, bar); e.preventDefault(); } }, {passive:false});
    bar.addEventListener("touchend", function(){ draggingBar=false; activeSeekBar=null; });
  }
  bindSeekBar($("#pbBar"));
  bindSeekBar($("#fpBar"));
  window.addEventListener("mousemove", function(e){ if (draggingBar) seekFromEvent(e, activeSeekBar); });
  window.addEventListener("mouseup", function(){ draggingBar=false; activeSeekBar=null; });

  // volume drag
  function volFromEvent(e){
    var bar = $("#pbVolBar"); var rect = bar.getBoundingClientRect();
    var x = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
    var pct = Math.min(1, Math.max(0, x/rect.width));
    audio.volume = pct; state.volume = pct; storeSet("volume", pct);
    $("#pbVolFill").style.width = (pct*100)+"%";
    $("#pbVolIcon use").setAttribute("href", pct===0 ? "#i-vol0" : "#i-vol");
  }
  var draggingVol=false;
  $("#pbVolBar").addEventListener("mousedown", function(e){ draggingVol=true; volFromEvent(e); });
  window.addEventListener("mousemove", function(e){ if (draggingVol) volFromEvent(e); });
  window.addEventListener("mouseup", function(){ draggingVol=false; });
  $("#pbVolFill").style.width = (state.volume*100)+"%";

  // 打开/关闭全屏播放器
  $("#pbMeta").onclick = openFullPlayer; $("#pbCover").onclick = openFullPlayer; $("#pbLyricBtn").onclick = openFullPlayer;
  $("#fpClose").onclick = function(){ closeFullPlayer(false); };
  $("#pbListBtn").onclick = function(){ openFullPlayer(); switchFpTab("playlist"); };
  bindFullPlayerGesture();

  $all(".fp-tab").forEach(function(t){ t.onclick = function(){ switchFpTab(t.dataset.tab); }; });

  // 登录相关（仅 Cookie）
  var btnCookie = $("#btnLoginCookie");
  if (btnCookie) btnCookie.onclick = function(){
    var v = ($("#cookieInput") && $("#cookieInput").value || "").trim();
    if (!v){ toast("请粘贴 Cookie"); return; }
    applyLogin(v);
  };
  var btnGuest = $("#btnGuest");
  if (btnGuest) btnGuest.onclick = function(){ closeLoginView(false); };
  var loginClose = $("#loginCloseBtn");
  if (loginClose) loginClose.onclick = function(){ closeLoginView(false); };

  $("#sheetMask").onclick = function(){ closeFullPlayer(false); };
}
var _fpClosing = false;
var _fpHistoryPushed = false;

/** 仅控制全屏播放器 UI 显示（不碰 history） */
function showFullPlayerUI(){
  if (!state.queue.length) return;
  initFpArtStyle();
  bindFullPlayerGesture();
  var fp = $("#fullPlayer");
  if (!fp) return;
  _fpClosing = false;
  fp.style.transition = "none";
  fp.style.transform = "translate3d(0,10%,0)";

  fp.classList.add("show");
  void fp.offsetHeight;
  fp.style.transition = "transform .5s cubic-bezier(0.34,1.56,0.64,1), opacity .35s cubic-bezier(0.22,1,0.36,1)";
  fp.style.transform = "translate3d(0,0,0)";
  fp.style.opacity = "1";
  syncAppUnderlay();
}

/** 全屏播放器打开期间，保证 history.state.overlay=player 且 restoreAffordance=none */
function ensurePlayerHistory(){
  var fp = $("#fullPlayer");
  if (!fp || !fp.classList.contains("show")) return;
  try {
    var st = currentHistoryState({ overlay: "player" });
    // 若当前条目已是 player 浮层则 replace 刷新；否则补一层
    if (history.state && history.state.overlay === "player"){
      history.replaceState(st, "", location.href);
    } else if (_fpHistoryPushed){
      history.replaceState(st, "", location.href);
    } else {
      history.pushState(st, "", location.href);
      _fpHistoryPushed = true;
    }
  } catch(e) {}
  setSubviewChrome(true);
}

function openFullPlayer(){
  if (!state.queue.length){ toast("先播放一首歌曲吧"); return; }
  var fp = $("#fullPlayer");
  if (!fp.classList.contains("show")){
    pushOverlayState("player");
    _fpHistoryPushed = true;
  }
  ensurePlayerHistory();
  showFullPlayerUI();
}

/**
 * 关闭全屏播放器
 * @param {boolean} [skipHistory] true=只关 UI（popstate/已处理 history）
 */
function closeFullPlayer(skipHistory){
  var fp = $("#fullPlayer");
  if (!fp || !fp.classList.contains("show") || _fpClosing) return;
  _fpClosing = true;
  fp.style.transition = "transform .4s cubic-bezier(0.22,1,0.36,1), opacity .3s ease";
  fp.style.transform = "translate3d(0,100%,0)";
  fp.style.opacity = "0";
  setTimeout(function(){
    fp.classList.remove("show");
    fp.style.transition = "none";
    fp.style.transform = "";
    fp.style.opacity = "";
    _fpClosing = false;
    setSubviewChrome(state.view !== "home");
    syncAppUnderlay();
  }, 280);
  // 只退掉播放器浮层这一层，禁止用 st.qqm 误退首页导致直接退出全屏
  if (!skipHistory && _fpHistoryPushed){
    _overlayNavLock = true;
    _ignorePop = 1;
    _fpHistoryPushed = false;
    try { history.back(); } catch(e) {}
    setTimeout(function(){ _overlayNavLock = false; }, 120);
  } else if (skipHistory){
    _fpHistoryPushed = false;
  }
  setSubviewChrome(state.view !== "home");
  syncAppUnderlay();
}
function switchFpTab(tab){
  $all(".fp-tab").forEach(function(t){ t.classList.toggle("active", t.dataset.tab===tab); });
  $("#lyricsWrap").style.display = tab==="lyrics" ? "block" : "none";

/** 全屏播放页：下滑手势关闭，回落到迷你播放栏 */
function bindFullPlayerGesture(){
  var fp = $("#fullPlayer");
  if (!fp || fp._gestureBound) return;
  fp._gestureBound = true;
  var startY = 0, startX = 0, dragging = false, moved = false;
  function onStart(e){
    if (!fp.classList.contains("show") || _fpClosing) return;
    var scrollEl = e.target.closest("#lyricsWrap, #playlistPanel");
    if (scrollEl && scrollEl.scrollTop > 2) return;
    var t = e.touches ? e.touches[0] : e;
    startY = t.clientY; startX = t.clientX;
    dragging = true; moved = false;
    fp.style.transition = "none";
  }
  function onMove(e){
    if (!dragging || _fpClosing) return;
    var t = e.touches ? e.touches[0] : e;
    var dy = t.clientY - startY;
    var dx = t.clientX - startX;
    if (!moved && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8){ dragging = false; return; }
    if (dy < 0) dy = 0;
    if (dy > 6) moved = true;
    if (moved){
      fp.style.transform = "translateY("+dy+"px)";
      fp.style.opacity = String(Math.max(0.35, 1 - dy / (window.innerHeight * 0.7)));
      if (e.cancelable) e.preventDefault();
    }
  }
  function onEnd(e){
    if (!dragging) return;
    dragging = false;
    if (_fpClosing) return;
    var t = (e.changedTouches && e.changedTouches[0]) || e;
    var dy = t.clientY - startY;
    if (moved && dy > 110){
      closeFullPlayer(false);
    } else {
      fp.style.transition = "transform .45s cubic-bezier(0.34,1.56,0.64,1), opacity .3s ease";
      fp.style.transform = "translate3d(0,0,0)";
      fp.style.opacity = "1";
    }
  }
  fp.addEventListener("touchstart", onStart, { passive: true });
  fp.addEventListener("touchmove", onMove, { passive: false });
  fp.addEventListener("touchend", onEnd, { passive: true });
  fp.addEventListener("touchcancel", onEnd, { passive: true });
}

/* ============================================================
   § 13. TV 遥控方向导航
   ------------------------------------------------------------
   遥控器按键在 fongmi/WebHome 环境下通常映射为标准方向键
   事件（ArrowUp/Down/Left/Right + Enter）。采用几何最近邻算法
   在当前可见的可聚焦元素间移动焦点，避免为每个视图手写导航图。
   ============================================================ */
var FOCUSABLE_SEL = ".nav-item,.card,.mv-card,.radio-card,.rank-card,.song-row,.hero-play,.login-btn,.cookie-area,.sr-tab,.hot-search-tag,.pb-play,.pb-ctrl-btn,.fp-tab,.lyric-line";
var curFocusEl = null;
function tvFocusables(){
  return $all(FOCUSABLE_SEL).filter(function(e){
    var r = e.getBoundingClientRect();
    return r.width>0 && r.height>0 && r.top < window.innerHeight && r.bottom > -50;
  });
}
function setTvFocus(node){
  if (curFocusEl) curFocusEl.classList.remove("tv-focus");
  curFocusEl = node;
  if (node){ node.classList.add("tv-focus"); node.scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"}); }
}
function moveTvFocus(dir){
  var list = tvFocusables();
  if (!list.length) return;
  if (!curFocusEl || list.indexOf(curFocusEl) === -1){ setTvFocus(list[0]); return; }
  var r0 = curFocusEl.getBoundingClientRect();
  var c0 = {x:r0.left+r0.width/2, y:r0.top+r0.height/2};
  var best=null, bestScore=Infinity;
  list.forEach(function(node){
    if (node===curFocusEl) return;
    var r = node.getBoundingClientRect();
    var c = {x:r.left+r.width/2, y:r.top+r.height/2};
    var dx=c.x-c0.x, dy=c.y-c0.y;
    var ok = dir==="left"?dx<-4 : dir==="right"?dx>4 : dir==="up"?dy<-4 : dy>4;
    if (!ok) return;
    var primary = (dir==="left"||dir==="right") ? Math.abs(dx) : Math.abs(dy);
    var secondary = (dir==="left"||dir==="right") ? Math.abs(dy) : Math.abs(dx);
    var score = primary + secondary*2.2;
    if (score < bestScore){ bestScore = score; best = node; }
  });
  if (best) setTvFocus(best);
}
document.addEventListener("keydown", function(e){
  // 系统返回键 / Backspace：全局统一处理（手机 WebView + TV）
  // 输入框内的 Backspace 用于删字，绝不能当成返回
  if (e.key === "Backspace" || e.keyCode === 4 || e.key === "Escape"){
    var t = e.target;
    var tag = (t && t.tagName) ? t.tagName.toUpperCase() : "";
    var typing = tag === "INPUT" || tag === "TEXTAREA" || (t && t.isContentEditable);
    // Escape 在输入框内：仅失焦，不返回（官方常见行为）
    if (typing && e.key === "Escape"){
      try { t.blur(); } catch(err) {}
      e.preventDefault();
      return;
    }
    // 输入框内 Backspace：放行给系统删字
    if (typing && (e.key === "Backspace" || e.keyCode === 4)){
      return;
    }
    if (handleBack()){
      e.preventDefault();
      e.stopPropagation();
    }
    return;
  }
  if (!state.isTv) return;
  var map = {ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
  if (map[e.key]){ e.preventDefault(); moveTvFocus(map[e.key]); }
  else if (e.key==="Enter" || e.keyCode===13){ if (curFocusEl) curFocusEl.click(); }
});
document.addEventListener("click", function(e){
  if (!state.isTv) return;
  var target = e.target.closest(FOCUSABLE_SEL);
  if (target) setTvFocus(target);
}, true);


/* ============================================================
   § 14. 初始化
   ============================================================ */
function bootApp(){
  // 重新检测 TV（fongmiClient 可能稍晚注入）
  if (window.fongmiClient && window.fongmiClient.isLeanback){
    state.isTv = true;
    document.documentElement.classList.add("tv-mode");
  }
  if (state.user){ closeLoginView(true); syncUserAvatar(); fetchUserProfile(); }
  else { syncUserAvatar(); }
  bindEvents();
  $("#pbQuality").textContent = state.quality;
  syncModeUI();
  // 启动氛围背景（主题色光晕，播放后会随封面变色）
  try { applyAmbient(themeAmbientColors()); } catch(e) {}
  if (!state.sourceUnlocked){ state.source = "qq"; }
  else {
    var saved = storeGet("musicSource", "qq");
    if (saved && saved !== "qq") state.source = saved;
  }
  // 启动即显示迷你播放栏（空状态），与 Apple Music 一致
  ensurePlayerBarVisible();

  var hash = location.hash.replace("#","");
  var parts = hash.split("/");
  var startView = VIEWS.indexOf(parts[0])>-1 ? parts[0] : "home";
  try {
    // Solene：首页 = entry0，裸 URL，不垫哨兵
    if (!history.state || !history.state.qqm){
      history.replaceState({view:"home", params:{}, qqm:1}, "", location.pathname + location.search);
    }
    if (startView !== "home"){
      history.pushState({view:startView, params:{}, qqm:1}, "", hashFor(startView, {}));
    } else {
      history.replaceState({view:"home", params:{}, qqm:1}, "", location.pathname + location.search);
    }
  } catch(e) {}
  switchView(startView, {}, false);
  setSubviewChrome(startView !== "home");
  syncAppUnderlay();
  window.handleBack = handleBack;
  window.__qqmBack = function(){ try { return handleBack(); } catch(e){ return false; } };

  if (state.isTv) setTimeout(function(){ setTvFocus(tvFocusables()[0]); }, 400);
}

function init(){
  // App 内必须先等 fm 注入，再发请求；否则会误走 JSONP/fetch 拿不到数据
  whenFm(5000).then(function(fmObj){
    if (fmObj) console.log("[qqm] fm SDK ready");
    else console.warn("[qqm] fm SDK not found, fallback JSONP/fetch");
    bootApp();
  }).catch(function(){ bootApp(); });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();
